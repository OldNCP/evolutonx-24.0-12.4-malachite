name: Build Evolution X 12.4 Malachite

on:
  push:
    branches:
      - evolutionx-24.0
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target (bacon for full zip, target-files-package otatools for release target)'
        required: true
        default: 'bacon'
      runs_on:
        description: 'Runner label (use self-hosted for custom servers or ubuntu-22.04 for GitHub runners)'
        required: true
        default: 'ubuntu-22.04'

permissions:
  contents: write

jobs:
  build:
    name: Build Evolution X 12.4
    runs-on: ${{ github.event.inputs.runs_on || 'ubuntu-22.04' }}
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (for GitHub-hosted runners)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache 2>/dev/null || true
          sudo docker system prune -af 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          sudo curl -sLo /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Configure Git identity
        run: |
          git config --global user.name "OldNCP"
          git config --global user.email "bot@github.actions"
          git config --global color.ui false
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Initialize Evolution X source tree
        run: |
          mkdir -p ~/evox
          cd ~/evox
          repo init -u https://github.com/Evolution-X/manifest.git -b cnb --git-lfs --depth=1
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/manifests/evolution.xml" .repo/local_manifests/evolution.xml

      - name: Sync source repositories
        run: |
          cd ~/evox
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          if [ ! -d "device/xiaomi/malachite" ]; then
            mkdir -p device/xiaomi/malachite
            cp -r "$GITHUB_WORKSPACE/." device/xiaomi/malachite/
          fi

      - name: Record source snapshot
        run: |
          cd ~/evox
          if [ -f device/xiaomi/malachite/tools/source-snapshot.sh ]; then
            bash device/xiaomi/malachite/tools/source-snapshot.sh || true
          fi

      - name: Build Evolution X
        run: |
          cd ~/evox
          export EVO_BUILD_TYPE=Unofficial
          export WITH_GMS=true
          source build/envsetup.sh
          breakfast malachite userdebug
          TARGET="${{ github.event.inputs.build_target || 'bacon' }}"
          mka -j$(nproc --all) --skip-soong-tests $TARGET

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EvolutionX-12.4-malachite-output
          path: |
            ~/evox/out/target/product/malachite/EvolutionX-*.zip
            ~/evox/out/target/product/malachite/boot.img
            ~/evox/out/target/product/malachite/recovery.img
            ~/evox/out/target/product/malachite/init_boot.img
          if-no-files-found: warn
